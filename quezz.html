<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSQuizStarter</title>
    <link rel="stylesheet" href="css/quezz.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=time_auto" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=time_auto" />
</head>

<body>
    <header class="top-header">
        <h1 class="title">QuizNova</h1>
    </header>

    <main class="quiz-page">
        <div class="last-score-banner">
            <p>Votre dernier score : <span id="score">0</span> / 10</p>
        </div>

        <div class="container">
            <div class="heder_container">
                <p class="nbr_question">Question <span id="nbr_question"></span></p>
                <div class="chronometre_par_question">
                    <span class="label">Temps :</span>
                    <p id="time_par_question" class="time_par_question">0</p>
                </div>
            </div>

            <div class="timer-bar-wrap">
                <div class="timer-bar">
                    <div class="timer-bar-fill"></div>
                </div>
                <div class="timer-side-value"><span id="time_side">0</span>s</div>
            </div>

            <div class="chronometre_Global">
                <p><span id="time_global_minute" class="time_global_minute">0</span>:<span
                        id="time_global_seconde" class="time_global_seconde">0</span></p>
            </div>

            <p id="question" class="question"></p>
            <div class="reponses">
                <div class="option reponse1">
                    <label><input type="radio" class="choix answerInput" name="choix">
                        <span id="choix1"></span></label>
                </div>

                <div class="option reponse2">
                    <label><input type="radio" class="choix answerInput" name="choix">
                        <span id="choix2"></span></label>
                </div>

                <div class="option reponse3">
                    <label><input type="radio" class="choix answerInput" name="choix">
                        <span id="choix3"></span></label>
                </div>

                <div class="option reponse4">
                    <label><input type="radio" class="choix answerInput" name="choix">
                        <span id="choix4"></span></label>
                </div>

                <button id="suivant" onclick="afficherQst(1)">Suivant</button>
            </div>
        </div>
    </main>

    <script src="js/quezz.js"></script>
    
</body>

</html>
