<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil</title>
    <link rel="stylesheet" href="css/style.css">

        <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
</head>

<body>
    <header class="top-header">
        <h1 class="app-title">QuizNova</h1>
    </header>

    <main class="page-wrap">
        <div class="last-score-banner">
            <p>Votre dernier score : <span id="lastScoreValue">/ 10</span></p>
        </div>

        <div class="container">
            <div class="UserName">
                <p class="Name">Votre pseudo:</p>
                <input id="input_name" type="text" placeholder="Exemple: Fouad" class="input_name">
                <p id="Error" class="Error"></p>
            </div>

            <div class="theme">
                <p class="theme1">Choisissez une thématique:</p>
                <input id="ChoixTheme" type="hidden" value="Theme">
                <div class="theme-cards">
                    <div class="theme-card theme-programation" data-theme="Programation">
                        <span>Programation</span>
                    </div>
                    <div class="theme-card theme-math" data-theme="Math">
                        <span>Math</span>
                    </div>
                    <div class="theme-card theme-sport" data-theme="Sport">
                        <span>Sport</span>
                    </div>
                </div>
                <p id="Error1" class="Error"></p>
            </div>

            <button id="StartQuiz" class="StartQuiz">Commencer le Quiz <span class="material-symbols-outlined">
                    arrow_forward
                </span></button>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
